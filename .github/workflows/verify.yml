name: verify
# Every reference solution passes its tests, and the checker runs on a clean
# machine with nothing but CPU PyTorch and numpy.
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install numpy pandas scikit-learn pytest
      - run: python -m labkit verify
      - name: Every notebook is valid JSON with a setup cell
        run: |
          python - <<'PY'
          import glob, json
          bad = [p for p in glob.glob("units/*/*/lab.ipynb")
                 if "labkit.open" not in json.dumps(json.load(open(p)))]
          print(len(glob.glob("units/*/*/lab.ipynb")), "notebooks;", "bad:", bad)
          raise SystemExit(1 if bad else 0)
          PY
